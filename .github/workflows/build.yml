name: Build Tasks & Reminders APK
on:
  push:
    branches: [tasks-reminders-widget]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk TasksRemindersWidget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TasksRemindersWidget-APK
          path: TasksRemindersWidget.apk
          if-no-files-found: error
      - name: Publish APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/tasks-reminders-widget'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create tasks-reminders-v1.0.0 ./TasksRemindersWidget.apk --title "Tasks & Reminders Widget 1.0.0" --notes "Installable Android widget APK" --target tasks-reminders-widget

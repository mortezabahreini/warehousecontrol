name: Build Parmin Counter APK
on:
  push:
    branches: [parmin-good-bad-counter]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable signed APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk ParminCounter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ParminCounter-APK
          path: ParminCounter.apk
          if-no-files-found: error
      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/parmin-good-bad-counter'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create parmin-counter-v1.0.0 ./ParminCounter.apk \
            --title "Parmin Counter v1.0.0" \
            --notes "Simple Persian good/bad behavior counter with manual weekly reset and archived results. No permissions required." \
            --target parmin-good-bad-counter

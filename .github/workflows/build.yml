name: Build installable Android APK
on:
  push:
    branches: [transparent-weather-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename installable APK
        run: cp app/build/outputs/apk/release/app-release.apk TransparentWeatherWidget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TransparentWeatherWidget-APK
          path: TransparentWeatherWidget.apk
          if-no-files-found: error
      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/transparent-weather-apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create weather-widget-v1.0.0 ./TransparentWeatherWidget.apk \
            --title "Transparent Weather Widget 1.0.0" \
            --notes "Install this APK directly on your Android phone. The widget is transparent, shows 12-hour time with AM/PM, date as DD/MM/YYYY, and auto-refreshing weather for your location." \
            --target transparent-weather-apk
